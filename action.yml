name: 'AIBOM Scanner'
description: 'Scan your codebase for AI SDK usage and compliance risks (NIST AI RMF, ISO 42001, EU AI Act, OWASP LLM and Agentic Top 10)'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format (json, table, sarif)'
    required: false
    default: 'sarif'
  severity-threshold:
    description: 'Fail if OBSERVED findings at or above this severity (low, medium, high, critical). Findings with no supporting evidence in the scanned source do not trip this gate.'
    required: false
    default: 'high'
  fail-on-incomplete-coverage:
    description: 'Fail (exit 3) if the scanner could not read some source languages. Off by default.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install aibom-scanner
      run: pip install aibom-scanner
      shell: bash
    - name: Run scan
      run: |
        ARGS="--path ${{ inputs.path }} --format ${{ inputs.format }} --severity-threshold ${{ inputs.severity-threshold }}"
        if [ "${{ inputs.fail-on-incomplete-coverage }}" = "true" ]; then
          ARGS="$ARGS --fail-on-incomplete-coverage"
        fi
        aibom-scanner scan $ARGS
      shell: bash
